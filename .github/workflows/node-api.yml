# Reusable: CI para APIs/serviços Node.js (JS/TS).
# Uso, no repo consumidor (.github/workflows/ci.yml):
#
#   name: CI
#   on: { push: { branches: [main] }, pull_request: }
#   jobs:
#     ci:
#       uses: MabuThermas/.github/.github/workflows/node-api.yml@main
#       with:
#         node-version: "20"
#         publish-image: true        # builda e publica imagem no GHCR
#       secrets: inherit
name: node-api (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      working-directory:
        type: string
        default: "."
      publish-image:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  security:
    uses: MabuThermas/.github/.github/workflows/_security.yml@main

  image:
    name: build + push (GHCR)
    if: ${{ inputs.publish-image }}
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
