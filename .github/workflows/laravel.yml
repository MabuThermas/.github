# Reusable: CI para apps Laravel/PHP.
# Uso, no repo consumidor:
#
#   jobs:
#     ci:
#       uses: MabuThermas/.github/.github/workflows/laravel.yml@main
#       with:
#         php-version: "8.4"
#         publish-image: true
#       secrets: inherit
name: laravel (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: "8.4"
      publish-image:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: pint + phpunit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pint (code style — informativo)
        continue-on-error: true
        run: vendor/bin/pint --test || true
      - name: Testes
        run: |
          [ -f .env ] || cp .env.example .env
          php artisan key:generate
          php artisan test

  security:
    uses: MabuThermas/.github/.github/workflows/_security.yml@main

  image:
    name: build + push (GHCR)
    if: ${{ inputs.publish-image }}
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
